<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PedidosVoz - Historial</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>Historial de pedidos atendidos</h1>
    <div class="topbar-right">
      <a class="nav-link" href="index.html">Pedidos pendientes</a>
      <span id="conn-status" class="status">Conectando...</span>
    </div>
  </header>

  <main>
    <div class="filtros">
      <label for="fecha">Fecha</label>
      <input type="date" id="fecha" />
      <button id="btn-hoy" type="button" class="btn-secundario">Hoy</button>
    </div>

    <p id="empty" class="empty" hidden>No hay pedidos atendidos en esta fecha</p>
    <div id="grid" class="grid grid-historial"></div>
  </main>

  <script src="vendor/socket.io.min.js"></script>
  <script src="historial.js"></script>
</body>
</html>
