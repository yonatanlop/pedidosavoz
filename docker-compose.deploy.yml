# Overlay para desplegar en un servidor donde 80/443 ya estan ocupados por el
# Caddy de otro proyecto (ver deploy/shared-caddy.md).
#
#   docker compose -f docker-compose.yml -f docker-compose.deploy.yml up -d --build
#
# "web" deja de publicar su puerto al host: se conecta a la red externa
# compartida "edge" para que ese Caddy lo alcance por nombre de contenedor.
# "postgres" y "backend" tampoco publican su puerto: el propio nginx de "web"
# ya hace de proxy hacia el backend para /api y /socket.io (igual que en
# local), asi que todo el trafico externo entra por Caddy -> web -> backend,
# sin exponer el backend en HTTP plano directamente a internet.
#
# Requiere que exista la red externa: docker network create edge

services:
  postgres:
    ports: !reset []

  backend:
    ports: !reset []

  web:
    container_name: pedidosavoz-web
    ports: !reset []
    networks:
      - default
      - edge

networks:
  edge:
    external: true
